server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 50M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # ^~ gives these prefix locations priority over regex blocks below
    location ^~ /api/ {
        set $backend backend:3001;
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location ^~ /files/ {
        set $backend backend:3001;
        proxy_pass         http://$backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_read_timeout 60s;
    }

    # Static assets: return 404 if missing, never fall back to index.html
    location ~* \.(js|mjs|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;
}
