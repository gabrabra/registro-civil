version: "3.8"

networks:
  easypanel:
    external: true
  easypanel-projetos-ia:
    external: true

volumes:
  registro_civil_db:
  registro_civil_uploads:

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: registros_civil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${DB_PASSWORD:-rg_civil_pass_2024}"
    volumes:
      - registro_civil_db:/var/lib/postgresql/data
    networks:
      - easypanel-projetos-ia
    deploy:
      restart_policy:
        condition: any

  backend:
    image: registro-civil-backend:latest
    environment:
      DATABASE_URL: "postgres://postgres:${DB_PASSWORD:-rg_civil_pass_2024}@db:5432/registros_civil"
      N8N_WEBHOOK_URL: "https://n8ndev.devlogconsultoria.com.br/webhook/transcricao-cartorio"
      PORT: "3001"
      NODE_ENV: production
      JWT_SECRET: "${JWT_SECRET:-rg_civil_jwt_2024_secret}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-admin@registrocivil.com}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-Admin@2024}"
      RUNPOD_API_KEY: "${RUNPOD_API_KEY}"
      RUNPOD_POD_ID: "${RUNPOD_POD_ID:-6y0yvpxgoqoth8}"
    volumes:
      - registro_civil_uploads:/app/uploads
    networks:
      - easypanel-projetos-ia
    depends_on:
      - db
    deploy:
      restart_policy:
        condition: any

  frontend:
    image: registro-civil-frontend:latest
    networks:
      - easypanel
      - easypanel-projetos-ia
    deploy:
      restart_policy:
        condition: any
